<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felicidades por recibirte!</title>
    
    <!-- Importamos tipografías de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales y fondo animado */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita que aparezca la barra de desplazamiento */
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(-45deg, #1e003b, #4a005c, #80004f, #23004d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Animación del fondo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor del texto central (siempre por encima de la lluvia) */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10; /* Lo mantiene por encima de los mensajes que caen */
            width: 90%;
            pointer-events: none; /* Permite que los clics pasen a través si fuera necesario */
        }

        /* Texto principal (Modificado: más grande y con contorno) */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 9vw; /* Aumentado */
            color: #ffd700; /* Color dorado */
            -webkit-text-stroke: 2px #000000; /* Contorno negro */
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.8); /* Sombra reforzada */
            margin: 0;
            line-height: 1.2;
        }

        /* Texto secundario (Modificado: más grande y con contorno) */
        h2 {
            font-size: 4vw; /* Aumentado */
            color: #ffffff;
            font-weight: 600; /* Un poco más grueso para que el contorno se vea bien */
            -webkit-text-stroke: 1.5px #000000; /* Contorno negro */
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8); /* Sombra reforzada */
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* Contenedor donde caerán los mensajes */
        #rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Por debajo del texto central */
            pointer-events: none;
        }

        /* Estilo base para cada mensaje que cae */
        .falling-message {
            position: absolute;
            color: rgba(255, 255, 255, 0.85); /* Blanco un poco más opaco para que resalte más */
            white-space: nowrap;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); /* Sombra un poco más fuerte para los mensajes */
            animation: fall linear forwards;
            top: -100px; /* Empieza arriba, fuera de la pantalla */
        }

        /* Animación de caída */
        @keyframes fall {
            0% { 
                transform: translateY(0); 
                opacity: 0; 
            }
            5% { 
                opacity: 1; /* Aparece suavemente */
            }
            90% { 
                opacity: 1; 
            }
            100% { 
                transform: translateY(calc(100vh + 200px)); /* Termina abajo, fuera de la pantalla */
                opacity: 0; 
            }
        }

        /* Adaptabilidad para celulares (Pantallas más chicas - Modificado para mantener proporciones grandes) */
        @media (max-width: 768px) {
            h1 { font-size: 15vw; }
            h2 { font-size: 7vw; }
        }
    </style>
</head>
<body>

    <!-- Capa de la lluvia de mensajes -->
    <div id="rain-container"></div>

    <!-- Capa del mensaje central -->
    <div class="center-container">
        <h1>¡Felicidades por recibirte!</h1>
        <h2>Te queremos mucho</h2>
    </div>

    <!-- Script de JavaScript para generar la lluvia -->
    <script>
        // Array con todos los mensajes que querés que caigan
        const mensajes = [
            "¡Éxitos en esta nueva etapa! - Sofi",
            "¡Lo lograste! - Valen",
            "Estamos muy orgullosos - Guille",
            "¡Felicidades! - Juancho",
            "¡A festejar! - Mirko",
            "¡Que orgullo gigante! - Mamá"
        ];

        // Array con los iconos especiales (incluye vóley, libros y el chiste de River con hielo)
        const iconos = ['👓','❤️', '🍷', '🛵', '🐈', '🐶', '🌸', '🧉', '🏎️', '🥐', '🐉', '⚔️', '🏐', '📚', '🤍❤️🤍🧊'];

        const container = document.getElementById('rain-container');

        // Función para crear un solo mensaje que cae
        function crearMensaje() {
            const drop = document.createElement('div');
            drop.classList.add('falling-message');
            
            // Decidir al azar si cae un texto o un icono (20% de probabilidad de icono)
            if (Math.random() < 0.20) {
                // Selecciona un icono al azar
                drop.innerText = iconos[Math.floor(Math.random() * iconos.length)];
                // Los iconos un poco más grandes para que se vean bien (entre 2rem y 3.5rem)
                const fontSize = Math.random() * 1.5 + 2; 
                drop.style.fontSize = fontSize + 'rem';
            } else {
                // Selecciona un mensaje al azar de la lista
                drop.innerText = mensajes[Math.floor(Math.random() * mensajes.length)];
                // Tamaño de letra al azar (entre 1rem y 2.2rem)
                const fontSize = Math.random() * 1.2 + 1; 
                drop.style.fontSize = fontSize + 'rem';
            }

            // Posición horizontal al azar (entre el 2% y el 90% de la pantalla para que no se corte)
            const startPos = Math.random() * 88 + 2; 
            drop.style.left = startPos + 'vw';

            // Duración de la caída al azar (entre 8 y 18 segundos)
            const duration = Math.random() * 10 + 8; 
            drop.style.animationDuration = duration + 's';

            // Agrega el mensaje a la pantalla
            container.appendChild(drop);

            // Elimina el mensaje del HTML una vez que termina de caer (para no sobrecargar la memoria)
            setTimeout(() => {
                drop.remove();
            }, duration * 1000);
        }

        // Generar algunos mensajes iniciales para que la pantalla no esté vacía al cargar
        for(let i=0; i < 15; i++) {
            setTimeout(crearMensaje, Math.random() * 3000);
        }

        // Configura el intervalo para seguir creando mensajes continuamente
        // 600 milisegundos = crea un mensaje nuevo poco más de 1 vez por segundo
        setInterval(crearMensaje, 600);
    </script>
</body>
</html>
