<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felicidades por recibirte!</title>
    
    <!-- Importamos tipografías de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales y fondo animado */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita que aparezca la barra de desplazamiento */
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(-45deg, #1e003b, #4a005c, #80004f, #23004d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Animación del fondo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor del texto central */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10; 
            width: 90%;
            pointer-events: none; 
        }

        /* Texto principal */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 9vw; 
            color: #ffd700; 
            -webkit-text-stroke: 2px #000000; 
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.8); 
            margin: 0;
            line-height: 1.2;
        }

        /* Texto secundario */
        h2 {
            font-size: 4vw; 
            color: #ffffff;
            font-weight: 600; 
            -webkit-text-stroke: 1.5px #000000; 
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8); 
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* Contenedor donde caerán los mensajes */
        #rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        /* Estilo base para cada mensaje que cae */
        .falling-message {
            position: absolute;
            color: rgba(255, 255, 255, 0.85); 
            white-space: nowrap;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); 
            animation: fall linear forwards;
            top: -100px; 
        }

        /* Animación de caída */
        @keyframes fall {
            0% { 
                transform: translateY(0); 
                opacity: 0; 
            }
            5% { 
                opacity: 1; 
            }
            90% { 
                opacity: 1; 
            }
            100% { 
                transform: translateY(calc(100vh + 200px)); 
                opacity: 0; 
            }
        }

        /* Adaptabilidad para celulares */
        @media (max-width: 768px) {
            h1 { font-size: 15vw; }
            h2 { font-size: 7vw; }
        }
    </style>
</head>
<body>

    <div id="rain-container"></div>

    <div class="center-container">
        <h1>¡Felicidades por recibirte!</h1>
        <h2>Te queremos mucho</h2>
    </div>

    <script>
        const mensajes = [
            "¡Éxitos en esta nueva etapa! - Sofi",
            "¡Lo lograste! - Valen",
            "Estamos muy orgullosos - Guille",
            "¡Felicidades! - Juancho",
            "¡A festejar! - Mirko",
            "¡Que orgullo gigante! - Mamá"
        ];

        // Bola de disco eliminada, usamos confeti en su lugar. Escudo de River con círculos.
        const iconos = ['❤️', '🍷', '🛵', '🐈', '🐶', '🌸', '🧉', '🎉', '🏎️', '🥐', '🐉', '⚔️', '🏐', '📚', '⚪🔴⚪🧊'];

        const container = document.getElementById('rain-container');

        function crearMensaje() {
            const drop = document.createElement('div');
            drop.classList.add('falling-message');
            
            if (Math.random() < 0.18) {
                drop.innerText = iconos[Math.floor(Math.random() * iconos.length)];
                const fontSize = Math.random() * 1.5 + 2; 
                drop.style.fontSize = fontSize + 'rem';
            } else {
                drop.innerText = mensajes[Math.floor(Math.random() * mensajes.length)];
                const fontSize = Math.random() * 1.2 + 1; 
                drop.style.fontSize = fontSize + 'rem';
            }

            const startPos = Math.random() * 65; 
            drop.style.left = startPos + 'vw';

            const duration = Math.random() * 10 + 8; 
            drop.style.animationDuration = duration + 's';

            container.appendChild(drop);

            setTimeout(() => {
                drop.remove();
            }, duration * 1000);
        }

        for(let i=0; i < 15; i++) {
            setTimeout(crearMensaje, Math.random() * 3000);
        }

        setInterval(crearMensaje, 600);
    </script>
</body>
</html>
